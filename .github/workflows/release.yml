name: Release

# On every push to main, release-please updates a release PR that bumps
# version.py and CHANGELOG.md from Conventional Commits. Merging that PR tags
# the version and creates the GitHub release; the build job then attaches the
# Windows .exe. See DECISION.md D-016.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Rebuild and attach the .exe to an existing release tag (for example v1.1.0)"
        required: true

# Jobs get only the permissions they list. Only pushes to main and people with
# write access can start this workflow; fork pull requests cannot.
permissions: {}

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: >-
      always() &&
      (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe
        run: python build.py

      - name: Create zip archive
        run: Compress-Archive -Path dist/CS2Translator/* -DestinationPath "CS2Translator-$env:TAG-win64.zip"

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:TAG" "CS2Translator-$env:TAG-win64.zip" --clobber --repo "${{ github.repository }}"
